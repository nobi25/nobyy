services:
  noby:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - noby_data:/app/data
      - noby_generated:/app/public/generated
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  noby-worker:
    build: .
    command: ["npm", "run", "worker:daemon"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - noby_data:/app/data
      - noby_generated:/app/public/generated
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      noby:
        condition: service_healthy
volumes:
  noby_data:
  noby_generated:
